version: '3'

services:
  # Frontend UI service
  frontend:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/Dockerfile.frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:24125
      - NEXT_PUBLIC_CRAWL4AI_URL=http://localhost:11235
      - NEXT_PUBLIC_MCP_URL=https://devdocs-mcp.vidurshan-sribala.workers.dev
    volumes:
      - ../../storage:/app/storage
    depends_on:
      - crawl4ai

  # Crawl4AI service
  crawl4ai:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/Dockerfile.backend
    command: ["npm", "run", "crawl4ai"]
    ports:
      - "11235:11235"
    environment:
      - PORT=11235
      - NODE_ENV=development
    volumes:
      - ../../storage:/app/storage

networks:
  default:
    driver: bridge 